# Decap CMS configuration for feliksmakarios.github.io
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: FeliksMakarios/feliksmakarios.github.io
  branch: main
  base_url: https://decap-oauth-vercel-ten.vercel.app
  # The repository is public, so a public_repo token is enough to commit.
  auth_scope: public_repo

publish_mode: simple

media_folder: "assets/images"
public_folder: "/assets/images"

site_url: https://feliksmakarios.github.io

collections:
  # ==================== NEWS ====================
  - name: "news"
    label: "News"
    label_singular: "News item"
    folder: "_news"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date_str}} · {{title.en}}"
    description: "Homepage news highlights."
    sortable_fields:
      - { field: "date_str", default_sort: "desc" }
      - "title.en"
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - { label: "EN", name: "en", widget: "string" }
          - { label: "ID", name: "id", widget: "string" }
      - { label: "Date", name: "date_str", widget: "string", hint: "YYYY-MM-DD or YYYY-MM" }
      - label: "Body"
        name: "body"
        widget: "object"
        fields:
          - { label: "EN", name: "en", widget: "text" }
          - { label: "ID", name: "id", widget: "text" }

  # ==================== PUBLICATIONS ====================
  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "_publications"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    description: "Academic publications."
    sortable_fields:
      - { field: "year", default_sort: "desc" }
      - "title"
    editor:
      preview: false
    fields:
      - { label: "Slug (ID)", name: "slug", widget: "string", hint: "Unique identifier, e.g. biomind-bert-2026" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "list", allow_add: true }
      - { label: "Venue", name: "venue", widget: "string" }
      - label: "Venue type"
        name: "venue_type"
        widget: "select"
        options: ["journal", "conference", "seminar"]
        default: "conference"
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Link (DOI or publisher URL)", name: "link", widget: "string", required: false }
      - label: "PDF"
        name: "pdf"
        widget: "file"
        required: false
        media_folder: "/assets/papers"
        public_folder: "/assets/papers"
        hint: "Upload a PDF you are allowed to share (open-access version, or your accepted manuscript for IEEE papers). You can also paste a direct link ending in .pdf. Shows a PDF button under the publication."
      - label: "Open access?"
        name: "open_access"
        widget: "boolean"
        default: false
        required: false
        hint: "Turn on if anyone can read the full paper for free on the publisher's site (most Indonesian SINTA journals). Leave off for paywalled papers such as most IEEE conference papers. Shows a green Open Access badge."
      - label: "Research area"
        name: "area"
        widget: "select"
        options:
          - { label: "Domain-Specific NLP", value: "domain-specific-nlp" }
          - { label: "Low-Resource Languages", value: "low-resource-languages" }
          - { label: "Bias & Fairness", value: "bias-fairness" }
          - { label: "Applied ML", value: "applied-ml" }
      - { label: "Sub-area", name: "sub_area", widget: "string" }

  # ==================== STUDENTS ====================
  - name: "students"
    label: "Students"
    label_singular: "Student"
    folder: "_students"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}} ({{status}})"
    description: "Current and alumni thesis students."
    sortable_fields:
      - "name"
      - "year_graduated"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["current", "alumni"]
        default: "alumni"
      - { label: "Cohort / Year", name: "cohort", widget: "string", required: false }
      - { label: "Year graduated", name: "year_graduated", widget: "number", value_type: "int", required: false }
      - label: "Thesis title"
        name: "title"
        widget: "object"
        required: false
        fields:
          - { label: "EN", name: "en", widget: "string" }
          - { label: "ID", name: "id", widget: "string" }
      - label: "Research area"
        name: "area"
        widget: "select"
        options:
          - { label: "Domain-Specific NLP", value: "domain-specific-nlp" }
          - { label: "Low-Resource Languages", value: "low-resource-languages" }
          - { label: "Bias & Fairness", value: "bias-fairness" }
          - { label: "Applied ML", value: "applied-ml" }
      - label: "Mentee status (current only)"
        name: "mentee_status"
        widget: "select"
        required: false
        options: ["proposal", "progress", "defense", "graduated"]
      - { label: "Thesis URL", name: "thesis_url", widget: "string", required: false }
      - { label: "Linked publication slug", name: "publication", widget: "string", required: false }
      - { label: "Current role", name: "current_role", widget: "string", required: false }

  # ==================== DEMOS ====================
  - name: "demos"
    label: "Demos"
    label_singular: "Demo"
    folder: "_demos"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    description: "Interactive prototypes."
    editor:
      preview: false
    fields:
      - { label: "Slug (ID)", name: "slug", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "My Project", value: "my-project" }
          - { label: "Student Project", value: "student-project" }
          - { label: "Outreach", value: "outreach" }
      - { label: "Icon (emoji)", name: "icon", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Meta"
        name: "meta"
        widget: "object"
        fields:
          - { label: "EN", name: "en", widget: "string" }
          - { label: "ID", name: "id", widget: "string" }
      - label: "Description"
        name: "description"
        widget: "object"
        fields:
          - { label: "EN", name: "en", widget: "text" }
          - { label: "ID", name: "id", widget: "text" }
      - { label: "Demo URL", name: "demo_url", widget: "string" }
      - { label: "Internal link?", name: "url_is_internal", widget: "boolean", default: false }

  # ==================== TEACHING ====================
  - name: "teaching"
    label: "Teaching"
    files:
      - label: "Teaching content"
        name: "teaching"
        file: "_data/teaching.yml"
        description: "Courses and supervision info."
        editor:
          preview: false
        fields:
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "EN", name: "en", widget: "text" }
              - { label: "ID", name: "id", widget: "text" }
          - label: "Supervision"
            name: "supervision"
            widget: "object"
            fields:
              - { label: "EN", name: "en", widget: "text" }
              - { label: "ID", name: "id", widget: "text" }

  # ==================== COMMUNITY SERVICE ====================
  - name: "community-service"
    label: "Community Service"
    label_singular: "Community service item"
    folder: "_community_service"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    description: "Pengabdian masyarakat."
    editor:
      preview: false
    fields:
      - { label: "Slug (ID)", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "list", allow_add: true }
      - { label: "Venue", name: "venue", widget: "string" }
      - label: "Venue type"
        name: "venue_type"
        widget: "select"
        options: ["journal", "conference", "seminar"]
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Target (EN)", name: "target_en", widget: "string" }
      - { label: "Target (ID)", name: "target_id", widget: "string" }
      - { label: "Description (EN)", name: "description_en", widget: "text" }
      - { label: "Description (ID)", name: "description_id", widget: "text" }

  # ==================== BLOG POSTS ====================
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog post"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    description: "Blog articles. Written in Bahasa Indonesia by default."
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "blog-post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["original", "translation"]
        default: "original"
        required: false
      - { label: "Summary", name: "summary_id", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: true }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - { label: "MathJax enabled", name: "mathjax", widget: "boolean", default: true, required: false }
      - { label: "Original URL", name: "original_url", widget: "string", required: false }
      - { label: "Original title", name: "original_title", widget: "string", required: false }
      - { label: "Original author", name: "original_author", widget: "string", required: false }
      - { label: "Original date (YYYY-MM-DD)", name: "original_date", widget: "string", required: false }
      - label: "Inspirations (original articles only)"
        name: "inspirations"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Author", name: "author", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Year", name: "year", widget: "number", value_type: "int" }
