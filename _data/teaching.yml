# Teaching: courses taught at UPH Informatics.
# Each course gets a page at /en/teaching/<slug>/ and /id/teaching/<slug>/
# (small stub files in en/teaching/ and id/teaching/, layout: course).
#
# Course fields:
#   slug        URL name, also the course_id of the stub pages
#   name        course name (English)
#   name_id     Indonesian name (optional; shown on the Indonesian pages)
#   code        course code (optional)
#   desc        bilingual short description
#   offerings   one entry per semester the course ran, newest first:
#     term        e.g. "Ganjil 2026/2027"
#     current     true for the semester running now (shown under "This semester"
#                 and on the Teaching page)
#     rps, slides, exams, assignments
#                 lists of { title, file, note }. "file" is a path such as
#                 /assets/teaching/ci-rps.pdf (CMS uploads land in
#                 assets/teaching/) or a full URL. An empty list shows
#                 "Akan segera diisi" / "Coming soon".
#     photos      list of { image, caption }

intro:
  en: "As a full-time lecturer in the Faculty of AI and Data Science, I teach across the undergraduate curriculum — from introductory computing to advanced machine learning and NLP. I'm also involved in campus and faculty task forces on academic quality assurance and curriculum development."
  id: "Sebagai dosen tetap di Fakultas AI dan Data Science, saya mengajar berbagai mata kuliah di kurikulum S1 mulai dari pengantar komputasi hingga machine learning lanjut dan NLP. Saya juga terlibat dalam task force kampus dan fakultas untuk quality assurance akademik dan pengembangan kurikulum."

groups:
  - id: foundational
    label:
      en: "Foundational"
      id: "Dasar"
    courses:
      - slug: intro-informatics-computing
        name: "Introduction to Informatics & Computing"
        desc:
          en: "First-year survey course covering computational thinking, basic programming, and the landscape of the discipline."
          id: "Mata kuliah tahun pertama yang mencakup computational thinking, dasar pemrograman, dan lanskap disiplin ini."
      - slug: object-oriented-modeling
        name: "Object-Oriented Modeling"
        desc:
          en: "OOP principles and UML-based modeling."
          id: "Prinsip OOP dan pemodelan berbasis UML."
      - slug: database-systems
        name: "Database Systems"
        desc:
          en: "Relational modeling, SQL, and normalization."
          id: "Pemodelan relasional, SQL, dan normalisasi."

  - id: data-science-ml
    label:
      en: "Data science & machine learning"
      id: "Data science & machine learning"
    courses:
      - slug: intro-data-science
        name: "Introduction to Data Science"
        desc:
          en: "The data-science pipeline, exploratory analysis, and basic machine learning modeling (supervised and unsupervised learning)."
          id: "Pipeline data science, exploratory analysis, dan pemodelan dasar machine learning (supervised dan unsupervised learning)."
      - slug: advanced-machine-learning
        name: "Advanced Machine Learning"
        desc:
          en: "Deep learning foundations, representation learning, and selected contemporary architectures."
          id: "Fondasi deep learning, representation learning, dan arsitektur kontemporer terpilih."
      - slug: data-science-app-studio
        name: "Data Science Application Development Studio"
        desc:
          en: "Capstone-style project course where students build and deploy end-to-end data applications."
          id: "Mata kuliah bergaya capstone di mana mahasiswa membangun dan men-deploy aplikasi data end-to-end."
      - slug: computational-intelligence
        name: "Computational Intelligence"
        name_id: "Kecerdasan Komputasional"
        desc:
          en: "Nature-inspired methods for problems that are hard to solve exactly: fuzzy logic and fuzzy inference, artificial neural networks, evolutionary algorithms, and swarm intelligence."
          id: "Metode yang terinspirasi dari alam untuk masalah yang sulit diselesaikan secara eksak: logika fuzzy dan inferensi fuzzy, jaringan saraf tiruan, algoritma evolusioner, dan swarm intelligence."
        offerings:
          - term: "Ganjil 2026/2027"
            current: true

  - id: specialized
    label:
      en: "Specialized"
      id: "Spesialisasi"
    courses:
      - slug: natural-language-processing
        name: "Natural Language Processing"
        desc:
          en: "Classical and neural approaches, with a hands-on focus on Indonesian-language applications using Hugging Face Transformers."
          id: "Pendekatan klasik dan neural, dengan fokus praktis pada aplikasi bahasa Indonesia menggunakan Hugging Face Transformers."

supervision:
  en: "I mentor undergraduate research projects in Transformer-based question answering, text classification, text summarization, aspect-based sentiment analysis, and bias / fairness studies in Indonesian NLP. If you're looking for a thesis advisor, see <a href=\"/en/research/\">research areas</a> for open topics."
  id: "Saya membimbing riset mahasiswa S1 di topik question answering berbasis Transformer, teks klasifikasi, peringkasan teks, aspect-based sentiment analysis, dan studi bias / fairness pada NLP Indonesia. Kalau kamu sedang mencari dosen pembimbing, silakan lihat <a href=\"/id/research/\">bidang riset</a> untuk topik yang terbuka."
