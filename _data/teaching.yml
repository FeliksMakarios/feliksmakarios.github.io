    name: Computer Organization & Architecture
    name_id: Organisasi & Arsitektur Komputer
    desc:
      en: 'How computers work beneath the software: data representation, digital logic, the CPU and its instruction set, the memory hierarchy, and input/output.'
      id: 'Cara kerja komputer di balik perangkat lunak: representasi data, logika digital, CPU dan set instruksinya, hierarki memori, serta input/output.'
