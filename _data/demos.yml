- id: nlp-visualisasi
  category: my-project
  icon: "🧩"
  title: "Visualisasi Interaktif Mata Kuliah NLP"
  meta:
    en: "Teaching companion · Course-wide visualization gallery"
    id: "Pelengkap pengajaran · Galeri visualisasi seluruh mata kuliah"
  description:
    en: "Interactive gallery of NLP concepts I built to accompany my Natural Language Processing course. Covers tokenization, embeddings, attention, sequential vs parallel computation, computational graphs, and several other core ideas in browser-only visualizations."
    id: "Galeri interaktif konsep-konsep NLP yang saya bangun sebagai pendamping mata kuliah Natural Language Processing. Mencakup tokenisasi, embedding, attention, komputasi sekuensial dan paralel, computational graph, serta beberapa ide inti lain dalam visualisasi yang berjalan di browser."
  url: "/demos/visualisasi-interaktif-nlp/"
  url_is_internal: true

- id: besklus
