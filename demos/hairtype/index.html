<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Jenis Rambut</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: url('hair-bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        h1 {
            color: #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 20px 0;
            cursor: pointer;
            border: none;
            background-color: #c0392b;
            color: white;
            border-radius: 5px;
        }
        button:hover {
            background-color: #a93226;
        }
        #webcam-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        #label-container {
            position: absolute;
            top: 0;
            right: -260px; /* Adjusted to add more space from webcam */
            width: 260px; /* Adjusted to match the new right position */
        }
        .label {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2c3e50; /* Changed font color to navy blue */
        }
        .bar-container {
            flex-grow: 1;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            margin-left: 10px;
            position: relative;
            overflow: hidden;
            width: 100px;
        }
        .bar {
            height: 100%;
            background-color: #007bff;
            border-radius: 5px;
            transition: width 0.3s ease-in-out;
        }
        main { display: flex; flex-direction: column; align-items: center; width: 100%; text-align: center; }
        .back-to-site { position: fixed; top: 12px; left: 12px; z-index: 10; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; font: 14px/1.2 Arial, sans-serif; text-decoration: none; }
        .back-to-site:hover { background: rgba(0,0,0,0.75); }
        @media (max-width: 700px) {
            body { height: auto; min-height: 100vh; justify-content: flex-start; padding: 56px 16px 32px; box-sizing: border-box; }
            #webcam-container { width: min(400px, 100%); height: auto; aspect-ratio: 1 / 1; }
            #webcam-container canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
            #label-container { position: static; width: 100%; margin-top: 12px; }
            .label { box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <nav aria-label="Navigasi situs"><a class="back-to-site" href="/id/demos/" onclick="if (document.referrer.indexOf(location.host) > -1) { history.back(); return false; }">← Kembali ke Demo</a></nav>
    <main>
    <h1>Klasifikasi Jenis Rambut</h1>
    <button type="button" id="start-button" onclick="init()">Start</button>
    <div id="webcam-container">
        <div id="label-container"></div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/P7GB3XqlG/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(400, 400, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");

            for (let i = 0; i < maxPredictions; i++) {
                const labelDiv = document.createElement("div");
                labelDiv.className = "label";
                labelDiv.innerHTML = `
                    <span id="class-name-${i}"></span>
                    <div class="bar-container">
                        <div class="bar" id="bar-${i}"></div>
                    </div>
                `;
                labelContainer.appendChild(labelDiv);
            }

            // Hide the start button after initialization
            document.getElementById("start-button").style.display = "none";
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(2);
                document.getElementById(`class-name-${i}`).innerText = `${className}: ${probability}%`;
                document.getElementById(`bar-${i}`).style.width = `${probability}%`;
            }
        }
    </script>
</body>
</html>
