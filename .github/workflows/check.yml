# Builds the site the same way GitHub Pages does and checks internal links and images.
# External links are not checked: many publisher sites block automated requests.
name: Build and check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace

      - name: Check links and images
        run: |
          gem install html-proofer -v "~> 5.0" --no-document
          htmlproofer ./_site \
            --disable-external \
            --no-enforce-https \
            --ignore-files "/\/admin\//,/\.dc\.html$/"
