title: Feliks Samosir
tagline: Lecturer & Researcher in NLP
description: >-
  Personal site of Feliks Victor Parningotan Samosir — Full-time Lecturer of
  Informatics, Faculty of AI and Data Science, Universitas Pelita Harapan.
  Research in Natural Language Processing for Indonesian and low-resource
  languages.
url: "https://feliksmakarios.github.io"
baseurl: ""

# Author / contact
author:
  name: Feliks Victor Parningotan Samosir
  short_name: Feliks Samosir
  title: Full-time Lecturer of Informatics
  affiliation: Faculty of AI and Data Science, Universitas Pelita Harapan
  institution: Universitas Pelita Harapan
  institution_url: https://www.uph.edu
  email: feliksmakarios19@gmail.com
  location: Tangerang, Banten, Indonesia
  github: FeliksMakarios
  linkedin: feliksmakarios
  scholar: https://scholar.google.com/citations?user=JGC7RIoAAAAJ
  orcid: https://orcid.org/0009-0006-0364-0275
  medium: https://medium.com/@feliksmakarios
  cv: /assets/cv/CV_Feliks_VP_Samosir.pdf

# Languages
languages: ["en", "id"]
default_lang: "en"

# Build
markdown: kramdown
permalink: /:path/
sass:
  style: compressed

plugins:
  - jekyll-sitemap

# Jekyll collections
collections:
  publications:
    output: false
    sort_by: year
  news:
    output: false
  students:
    output: false
  demos:
    output: false
  community_service:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: null
  - scope:
      path: ""
      type: news
    values:
      layout: null
  - scope:
      path: ""
      type: students
    values:
      layout: null
  - scope:
      path: ""
      type: demos
    values:
      layout: null
  - scope:
      path: ""
      type: community_service
    values:
      layout: null
  # Blog articles are Indonesian-only; the EN/ID switch opens the blog index.
  # No default layout here: the hand-built HTML articles are full documents and
  # must not be wrapped. Markdown posts get `layout: blog-post` from the CMS.
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/
      lang: id
      switch_slug: blog
  # Keep the CMS admin panel out of the sitemap
  - scope:
      path: "admin"
    values:
      sitemap: false

# Jekyll ignore
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - decap-oauth-vercel
  - admin/SETUP-OAUTH.md

# Keep demos folder as-is (not processed by Jekyll)
keep_files:
  - demos
