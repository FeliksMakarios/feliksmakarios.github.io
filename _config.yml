title: Feliks Samosir
tagline: Lecturer & Researcher in NLP
description: >-
  Personal site of Feliks Victor Parningotan Samosir — Fulltime Lecturer of
  Informatics, Faculty of AI and Data Science, Universitas Pelita Harapan.
  Research in Natural Language Processing for Indonesian and low-resource
  languages.
url: "https://feliksmakarios.github.io"
baseurl: ""

# Author / contact
author:
  name: Feliks Victor Parningotan Samosir
  short_name: Feliks Samosir
  title: Fulltime Lecturer of Informatics
  affiliation: Faculty of AI and Data Science, Universitas Pelita Harapan
  email: feliksmakarios19@gmail.com
  location: Tangerang, Banten, Indonesia
  github: FeliksMakarios
  linkedin: feliksmakarios
  scholar: https://scholar.google.com/citations?user=JGC7RIoAAAAJ&hl
  orcid: https://orcid.org/0009-0006-0364-0275
  medium: https://medium.com/@feliksmakarios

# Languages
languages: ["en", "id"]
default_lang: "en"

# Build
markdown: kramdown
permalink: /:path/
sass:
  style: compressed

plugins:
  - jekyll-sitemap

# Jekyll collections
collections:
  publications:
    output: false
    sort_by: year
  news:
    output: false
  students:
    output: false
  demos:
    output: false
  community_service:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: null
  - scope:
      path: ""
      type: news
    values:
      layout: null
  - scope:
      path: ""
      type: students
    values:
      layout: null
  - scope:
      path: ""
      type: demos
    values:
      layout: null
  - scope:
      path: ""
      type: community_service
    values:
      layout: null
  # Keep the CMS admin panel out of the sitemap
  - scope:
      path: "admin"
    values:
      sitemap: false

# Jekyll ignore
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - decap-oauth-vercel
  - admin/SETUP-OAUTH.md

# Keep demos folder as-is (not processed by Jekyll)
keep_files:
  - demos
