<script type="application/ld+json">
[{% for pub in include.pubs %}
  {
    "@context": "https://schema.org",
    "@type": "ScholarlyArticle",
    "headline": {{ pub.title | jsonify }},
    "name": {{ pub.title | jsonify }},
    "author": [{% for a in pub.authors %}{ "@type": "Person", "name": {{ a | jsonify }} }{% unless forloop.last %}, {% endunless %}{% endfor %}],
    "datePublished": {{ pub.year | append: "" | jsonify }},
    "isPartOf": { "@type": "{% if pub.venue_type == 'journal' %}Periodical{% else %}CreativeWork{% endif %}", "name": {{ pub.venue | jsonify }} }{% if pub.link and pub.link != "" %},
    "url": {{ pub.link | jsonify }}{% endif %}{% if pub.link contains 'doi.org/' %},
    "sameAs": {{ pub.link | jsonify }}{% endif %}
  }{% unless forloop.last %},{% endunless %}{% endfor %}
]
</script>
